[project]
name = "pay-client"
version = "0.1.0"
description = "Client de Pay (paiements et messages du parc Calao) : Python, avec un volet Django."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
django = ["Django>=4.2"]
dev = ["Django>=4.2", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pay_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
